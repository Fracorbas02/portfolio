<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Index des Fichiers</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 90%;
            margin: 0 auto;
            padding: 20px;
            background: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #555;
            text-align: center;
        }
        .file-list {
            margin: 20px 0;
            padding: 0;
            list-style: none;
        }
        .file-list a {
            display: block;
            width: 15%;
            padding: 10px;
            background: #fff;
            margin-bottom: 5px;
            border-radius: 5px;
            text-decoration: none;
            color: #333;
            transition: background 0.3s;
            word-wrap: break-word;
            word-break: break-all;
        }
        .file-list a:hover {
            background: #ddd;
        }
        footer {
            text-align: center;
            margin: 20px 0;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Index des Fichiers</h1>
        <ul class="file-list">
        </ul>
    </div>
    <footer>
        <p>&copy; 2024 Bastien Bonora. Tous droits r&eacute;serv&eacute;s.</p>
    </footer>
</body>
</html>
