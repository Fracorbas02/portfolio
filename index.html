<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bastien BONORA — Portfolio</title>
  <meta name="description" content="Portfolio de Bastien BONORA — passionné d'informatique et de cybersécurité, étudiant en Réseaux et Télécoms à l'IUT d'Annecy.">
  <meta name="author" content="Bastien BONORA">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#0f172a">

  <!-- Open Graph -->
  <meta property="og:title" content="Bastien BONORA — Portfolio">
  <meta property="og:description" content="Portfolio CLI de Bastien BONORA, cybersécurité et réseaux.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://bastienbonora.fr">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:image" content="https://bastienbonora.fr/src/asset/img/og-image.png">
  <meta property="og:image:width" content="1536">
  <meta property="og:image:height" content="1024">
  <meta property="og:image:alt" content="Portfolio de Bastien BONORA — terminal interactif">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <!-- Cache busting : incrémenter ?v= à chaque déploiement pour forcer
       le rechargement des ressources (les serveurs statiques n'envoient
       pas toujours de Cache-Control, le navigateur peut alors servir
       des fichiers périmés depuis son cache heuristique) -->
  <link rel="stylesheet" href="./src/CSS/fonts.css?v=20261002.3">
  <link rel="stylesheet" href="./src/CSS/reset.css?v=20260930">
  <link rel="stylesheet" href="./src/CSS/style.css?v=20261002.7">
</head>
<body>

  <!-- Terminal principal -->
  <main
    class="shellContainer"
    id="shellContainer"
    role="application"
    aria-label="Terminal interactif du portfolio"
  >
    <!-- Chrome / titlebar (sert aussi de poignée de drag) -->
    <header class="shell__chrome" id="shellChrome">
      <div class="shell__chrome__dots" role="group" aria-label="Contrôles de la fenêtre">
        <button type="button" class="shell__chrome__dot shell__chrome__dot--red" aria-label="Fermer la fenêtre"></button>
        <button type="button" class="shell__chrome__dot shell__chrome__dot--yellow" aria-label="Réduire la fenêtre"></button>
        <button type="button" class="shell__chrome__dot shell__chrome__dot--green" aria-label="Agrandir la fenêtre"></button>
      </div>
      <span class="shell__chrome__title">anonymous@portfolio — bash</span>
    </header>

    <div class="shellOutput booting" id="shellOutput" aria-live="polite" aria-atomic="false">
      <p id="defaultText" class="defaultText"></p>
    </div>

    <div class="currentShellLine" id="currentShellLine">
      <span class="searchLabel" id="searchLabel" hidden></span>
      <span class="defaultBeginShellLine" id="defaultBeginShellLine">anonymous@portfolio:/root&gt;&nbsp;</span>
      <label for="commandInput" class="visually-hidden">Saisir une commande</label>
      <input
        type="text"
        id="commandInput"
        class="commandInput"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        aria-label="Ligne de commande"
      >
      <span class="cursor" aria-hidden="true"></span>
    </div>
  </main>

  <!-- Menu latéral -->
  <nav class="menuContainer" aria-label="Navigation principale">
    <button
      type="button"
      class="hamburgerMenu"
      id="hamburgerMenu"
      aria-label="Ouvrir le menu de navigation"
      aria-expanded="false"
      aria-controls="menuContent"
    >
      <span class="bar1"></span>
      <span class="bar2"></span>
      <span class="bar3"></span>
    </button>

    <div class="menuContent" id="menuContent" hidden>
      <div class="insideMenu">

        <button type="button" class="accordion" aria-expanded="false">Présentation</button>
        <div class="panel">
          <button type="button" class="panelButton" data-url="./src/HTML/presentation.html">À propos de moi</button>
          <button type="button" class="panelButton" data-url="./root/presentation/CV/CV_Bastien_BONORA_2025.pdf">Afficher mon CV</button>
          <button type="button" class="panelButton" data-url="./root/presentation/Projet_Orientation.png">Mon projet d'orientation</button>
          <button type="button" class="panelButton" data-url="./root/presentation/Releve_Note_Bac.pdf">Mon relevé de notes du Bac</button>
          <button type="button" class="panelButton" data-url="./root/certif">Mes certifications</button>
        </div>

        <button type="button" class="accordion" aria-expanded="false">Projets</button>
        <div class="panel">
          <button type="button" class="panelButton" data-url="https://nastruire.fr">Nastruire</button>
          <button type="button" class="panelButton" data-url="https://docs.bastienbonora.fr">Documentation (Bastodoc)</button>
        </div>

        <button type="button" class="accordion" aria-expanded="false">Contact</button>
        <div class="panel">
          <button type="button" class="panelButton" data-url="https://www.linkedin.com/in/bastien-bonora">Mon profil LinkedIn</button>
          <button type="button" class="panelButton" data-url="https://github.com/Fracorbas02">Mon GitHub</button>
          <button type="button" class="panelButton" data-url="./root/presentation/pubkey">Clé PGP</button>
        </div>

      </div>
    </div>
  </nav>

  <!-- Texte caché pour lecteurs d'écran -->
  <style>
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>

  <noscript>
    <p style="color:#22d3ee;text-align:center;padding:2rem;font-family:monospace;">
      Ce portfolio nécessite JavaScript pour fonctionner. Merci de l'activer.
    </p>
  </noscript>

  <!-- Bouton d'allumage, affiché quand la fenêtre principale est fermée -->
  <button type="button" class="powerButton" id="powerButton" hidden aria-label="Rallumer le terminal"></button>

  <script src="./src/javascript/html.js?v=20261002.2" defer></script>
  <script src="./src/javascript/windowManager.js?v=20261002.6" defer></script>
  <script src="./src/javascript/cvViewer.js?v=20261002.7" defer></script>
  <script src="./src/javascript/docViewer.js?v=20261002.6" defer></script>
  <script src="./src/javascript/viewerData.js?v=20261002.15" defer></script>
  <script src="./src/javascript/theme.js?v=20261002.2" defer></script>
  <script src="./src/javascript/filesystem.js?v=20261001" defer></script>
  <script src="./src/javascript/boot.js?v=20261002.2" defer></script>
  <script src="./src/javascript/neofetch.js?v=20261002.2" defer></script>
  <script src="./src/javascript/commands.js?v=20261002.7" defer></script>
  <script src="./src/javascript/script.js?v=20261002.11" defer></script>
</body>
</html>
